name: CI

on:
  push:
    branches: [main, master, dev*]
  pull_request:
    branches: [main, master]

jobs:
  check-build-test:
    name: Check, Build & Test (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm-gc, wasm, js, native]
    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o /tmp/moon-install.sh
          bash /tmp/moon-install.sh
          ls -la $HOME/.moon/bin/
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Verify MoonBit
        run: moon version

      - name: Check formatting
        run: moon fmt --check

      - name: Moon check (${{ matrix.target }})
        run: moon check --target ${{ matrix.target }}

      - name: Moon build (${{ matrix.target }})
        run: moon build --target ${{ matrix.target }}

      - name: Moon test (${{ matrix.target }})
        run: moon test --target ${{ matrix.target }}
